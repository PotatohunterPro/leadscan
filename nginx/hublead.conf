# LeadScan — server block do domínio (TLS termina aqui, no host).
# Copiar para /etc/nginx/sites-available/hublead.conf e criar o symlink
# em sites-enabled. O certbot --nginx ajusta pra HTTPS automaticamente.
server {
    listen 80;
    server_name hublead.pradodacostasolucoes.com.br;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uploads de foto podem ser >1MB — alinhado com o limite do app (20MB)
    client_max_body_size 20M;
}
