<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadScan — Admin · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  :root {
    /* aliases LeadScan→HUB (cores reais vêm de /static/design-tokens.css) */
    --verde: var(--azure);
    --verde-escuro: var(--deep);
    --borda: var(--line);
    --texto-suave: var(--mut);
    --erro: var(--danger);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background:
      radial-gradient(1200px 600px at 10% -10%, #E4F1FB 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #DCEEFB 0%, transparent 55%),
      var(--bg);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .cartao {
    background: var(--card); border-radius: var(--r-lg); padding: 32px; width: 100%; max-width: 380px;
    box-shadow: var(--sh-lg); border: 1px solid var(--line); position: relative; overflow: hidden;
    animation: mpop .3s var(--ease);
  }
  .cartao::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--sky), var(--azure), var(--deep));
  }
  h1 { font-family: var(--font-head); font-size: 22px; margin-bottom: 4px; color: var(--deep); }
  p { color: var(--texto-suave); font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 6px; color: var(--mut); text-transform: uppercase; letter-spacing: .6px; }
  input[type=password], select {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--borda); border-radius: 12px; font: 600 15px var(--font-body);
    color: var(--ink); background: #F8FBFE; box-shadow: var(--sh-in); transition: .2s var(--ease);
  }
  input:focus, select:focus { border-color: var(--azure); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(0,137,206,.12); }
  button {
    width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--azure) 0%, var(--deep) 100%); color: #fff;
    font: 800 15px var(--font-body); cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,137,206,.35), 0 1px 0 rgba(255,255,255,.25) inset; transition: .25s var(--ease);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(0,137,206,.45), 0 1px 0 rgba(255,255,255,.25) inset; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--azure); outline-offset: 2px; }
  .erro { background: var(--danger-bg); border: 1px solid var(--danger-line); color: var(--danger);
    padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .voltar { display: block; text-align: center; margin-top: 14px; font-size: 12px; color: var(--texto-suave); text-decoration: none; }
  .cartao .logo-login { display: block; height: 42px; width: auto; margin: 0 auto 18px; }
</style>
</head>
<body>
  <div class="cartao">
    <img class="logo-login" src="/static/logo.png" alt="HUB Solução">
    <h1 style="text-align:center">Acesso do time</h1>
    <p style="text-align:center">Área restrita — digite a senha e selecione quem está entrando.</p>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="token" value="{{ token }}">
      {% if usuarios %}
      <label for="usuario">Quem está entrando</label>
      <select name="usuario" id="usuario" style="margin-bottom:10px">
        <option value="">— Gestor / visão geral —</option>
        {% for u in usuarios %}
        <option value="{{ u.nome }}">{{ u.nome }} · {{ u.papel }}</option>
        {% endfor %}
      </select>
      {% endif %}
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autofocus autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <a class="voltar" href="/bdr">← voltar à captura de leads</a>
  </div>
</body>
</html>
