<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadScan — Admin · Login</title>
<style>
  :root {
    /* tokens compartilhados com o app (static/index.html) — U9 */
    --verde: #16a34a;
    --verde-escuro: #15803d;
    --borda: #e2e4e9;
    --texto-suave: #667085;
    --erro: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f9d58, var(--verde));
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .cartao {
    background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p { color: var(--texto-suave); font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 12px; border: 1px solid var(--borda); border-radius: 10px; font-size: 15px;
  }
  input:focus { outline: 2px solid #bfe3cc; border-color: var(--verde); }
  button {
    width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 10px;
    background: var(--verde); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: var(--verde-escuro); }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--verde); outline-offset: 2px; }
  .erro { background: #fef2f2; border: 1px solid #fecaca; color: var(--erro);
    padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .voltar { display: block; text-align: center; margin-top: 14px; font-size: 12px; color: var(--texto-suave); text-decoration: none; }
</style>
</head>
<body>
  <div class="cartao">
    <h1>🔐 Painel Admin</h1>
    <p>LeadScan — área restrita. Digite a senha para continuar.</p>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="token" value="{{ token }}">
      {% if usuarios %}
      <label for="usuario">Quem está entrando</label>
      <select name="usuario" id="usuario" style="width:100%;padding:12px;border:1px solid var(--borda);border-radius:10px;font-size:15px;margin-bottom:10px">
        <option value="">— Gestor / visão geral —</option>
        {% for u in usuarios %}
        <option value="{{ u.nome }}">{{ u.nome }} · {{ u.papel }}</option>
        {% endfor %}
      </select>
      {% endif %}
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autofocus autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <a class="voltar" href="/">← voltar ao LeadScan</a>
  </div>
</body>
</html>
