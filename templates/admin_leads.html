<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadScan — Admin · Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  :root {
    /* aliases LeadScan→HUB (cores reais vêm de /static/design-tokens.css) */
    --verde: var(--azure);
    --verde-escuro: var(--deep);
    --fundo: var(--bg);
    --cartao: var(--card);
    --borda: var(--line);
    --texto: var(--ink);
    --texto-suave: var(--mut);
    --erro: var(--danger);
    --ia: var(--azure);
    --ia-escuro: var(--deep-2);
  }
  body { font-family: var(--font-body); color: var(--texto); padding-bottom: 40px; }
  header { background: linear-gradient(90deg, var(--deep) 0%, var(--deep-2) 45%, var(--azure) 100%);
    color: #fff; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 8px 24px rgba(11,77,140,.28); position: relative; }
  header h1 { font-family: var(--font-head); font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  header nav a { color: #EAF5FD; text-decoration: none; font-size: 13px; margin-left: 14px; font-weight: 700; }
  header nav a:hover { color: #fff; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md);
    box-shadow: var(--sh-md); padding: 18px; margin-bottom: 18px; }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .filtro { display: flex; flex-direction: column; }
  .filtro label { font-size: 11px; color: var(--texto-suave); font-weight: 800; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .6px; }
  input[type=text], input[type=date], select {
    padding: 10px 12px; border: 1.5px solid var(--borda); border-radius: 12px; font: 600 14px var(--font-body);
    background: #F8FBFE; color: var(--ink); box-shadow: var(--sh-in); transition: .2s var(--ease);
  }
  input:focus, select:focus { border-color: var(--azure); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(0,137,206,.12); }
  button { padding: 10px 18px; border: 0; border-radius: 12px; font: 800 13px var(--font-body); cursor: pointer; transition: .25s var(--ease); }
  .primario { background: linear-gradient(135deg, var(--azure) 0%, var(--deep) 100%); color: #fff;
    box-shadow: 0 8px 20px rgba(0,137,206,.3), 0 1px 0 rgba(255,255,255,.25) inset; }
  .primario:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(0,137,206,.4), 0 1px 0 rgba(255,255,255,.25) inset; }
  .secundario { background: #fff; color: var(--deep); border: 1.5px solid var(--line); box-shadow: var(--sh-sm); }
  .secundario:hover { border-color: var(--azure); color: var(--azure); }
  .csvexport { background: linear-gradient(135deg, var(--sky) 0%, var(--azure) 100%); color: #fff;
    text-decoration: none; display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 12px;
    font: 800 13px var(--font-body); box-shadow: 0 6px 16px rgba(0,137,206,.25), 0 1px 0 rgba(255,255,255,.25) inset; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--azure); outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--texto-suave); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg-2); }
  .vazio { color: var(--texto-suave); font-size: 13px; padding: 12px 0; }
  .total { font-size: 12px; color: var(--texto-suave); margin-top: 10px; }
  /* modal: base vem de design-tokens.css (bottom-sheet mobile + barra gradiente) */
  .modal h2 { font-family: var(--font-head); }
  .modal .campo b { display: block; font-size: 11px; text-transform: uppercase; color: var(--texto-suave); margin-bottom: 2px; letter-spacing: .4px; }
  .modal .campo span { font-size: 14px; color: var(--ink); }
  .modal .fotos { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .modal .fotos img { width: 130px; border-radius: 10px; border: 1px solid var(--borda); }
  .vazio-foto { color: var(--mut-2); font-size: 12px; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>LeadScan · Leads</h1>
  <nav>
    <a href="/funil">📊 Funil</a>
    <a href="/admin">Dashboard</a>
    <a href="/admin/logout">Sair</a>
  </nav>
</header>
<main>
  <div class="cartao">
    <h2 style="margin-bottom:12px">Filtrar leads</h2>
    <div class="filtros">
      <div class="filtro">
        <label for="busca">Buscar</label>
        <input type="text" id="busca" placeholder="nome, contato ou whatsapp" style="min-width:220px">
      </div>
      <div class="filtro">
        <label for="de">De</label>
        <input type="date" id="de">
      </div>
      <div class="filtro">
        <label for="ate">Até</label>
        <input type="date" id="ate">
      </div>
      <button class="primario" id="btn-buscar">Buscar</button>
      <button class="secundario" id="btn-limpar">Limpar</button>
      <a class="csvexport" id="btn-csv" style="padding:9px 16px">⬇ Exportar CSV</a>
    </div>
  </div>

  <div class="cartao">
    <table>
      <thead><tr><th>Data</th><th>Empresa</th><th>Contato</th><th>WhatsApp</th><th>Segmento</th></tr></thead>
      <tbody id="corpo"><tr><td colspan="5" class="vazio">Carregando…</td></tr></tbody>
    </table>
    <div class="total" id="total"></div>
  </div>
</main>

<div class="modal-fundo" id="modal-fundo">
  <div class="modal" id="modal"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ROTULOS = {
    nome_empresa: "Loja / Fantasia", endereco: "Endereço", cidade: "Cidade",
    nome_contato: "Contato", cargo: "Cargo", whatsapp: "WhatsApp",
    aceita_demonstracao: "Aceita demonstração", anotacoes: "Anotações",
    telefone: "Telefone", email: "E-mail", ramo_atividade: "Segmento",
    possui_sistema: "Possui sistema", qual_sistema: "Qual sistema",
    mensalidade: "Mensalidade (R$)", suporte_bom: "Suporte bom?",
    trocaria_suporte: "Trocaria por suporte?", trocaria_preco: "Trocaria por preço?",
    site: "Site", redes_sociais: "Redes sociais", criado_em: "Criado em"
  };
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function nomeFoto(caminho) {
    if (!caminho) return "";
    var partes = String(caminho).split("/");
    return partes[partes.length - 1];
  }
  function urlAtual() {
    var p = new URLSearchParams();
    if ($("busca").value.trim()) p.set("busca", $("busca").value.trim());
    if ($("de").value) p.set("de", $("de").value);
    if ($("ate").value) p.set("ate", $("ate").value);
    var q = p.toString();
    return "/api/leads" + (q ? "?" + q : "");
  }
  function carregar() {
    $("corpo").innerHTML = '<tr><td colspan="5" class="vazio">Carregando…</td></tr>';
    $("btn-csv").href = "/api/leads/export" + (urlAtual().slice("/api/leads".length));
    fetch(urlAtual())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var tbody = $("corpo");
        if (!d.leads || !d.leads.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="vazio">Nenhum lead encontrado.</td></tr>';
          $("total").textContent = "";
          return;
        }
        var h = "";
        d.leads.forEach(function (l) {
          h += '<tr data-id="' + l.id + '">' +
            "<td>" + esc((l.criado_em || "").slice(0, 16)) + "</td>" +
            "<td>" + esc(l.nome_empresa || "—") + "</td>" +
            "<td>" + esc(l.nome_contato || "—") + "</td>" +
            "<td>" + esc(l.whatsapp || "—") + "</td>" +
            "<td>" + esc(l.ramo_atividade || "—") + "</td></tr>";
        });
        tbody.innerHTML = h;
        $("total").textContent = d.total + " lead(s) encontrado(s). Clique numa linha para ver o detalhe.";
      })
      .catch(function (e) {
        $("corpo").innerHTML = '<tr><td colspan="5" class="vazio">Erro: ' + esc(String(e)) + "</td></tr>";
      });
  }
  function abrirDetalhe(id) {
    fetch("/api/leads/" + id)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var l = d.lead;
        var h = '<button class="fechar">✕</button>';
        h += "<h2>" + esc(l.nome_empresa || "Lead #" + l.id) + "</h2>";
        h += '<div class="sub">Lead #' + l.id + " · criado em " + esc(l.criado_em || "") + "</div>";
        h += '<div class="fotos">';
        h += l.foto_frente_path
          ? '<img src="/fotos/' + esc(nomeFoto(l.foto_frente_path)) + '" alt="frente">'
          : '<span class="vazio-foto">sem foto da frente</span>';
        h += l.foto_verso_path
          ? '<img src="/fotos/' + esc(nomeFoto(l.foto_verso_path)) + '" alt="verso">'
          : "";
        h += "</div>";
        Object.keys(ROTULOS).forEach(function (chave) {
          var valor = l[chave];
          if (valor) h += '<div class="campo"><b>' + esc(ROTULOS[chave]) + '</b><span>' + esc(valor) + "</span></div>";
        });
        // 📇 INFORMAÇÕES DO CARTÃO (item 24 do V2) — camada complementar do lead
        if (l.cartao) h += cartaoHtml(l.cartao);
        $("modal").innerHTML = h;
        $("modal-fundo").classList.add("aberto");
        $("modal").querySelector(".fechar").addEventListener("click", fechar);
      })
      .catch(function (e) {
        $("modal").innerHTML = '<button class="fechar">✕</button><p>Erro ao carregar: ' + esc(String(e)) + "</p>";
        $("modal-fundo").classList.add("aberto");
        $("modal").querySelector(".fechar").addEventListener("click", fechar);
      });
  }
  function cartaoHtml(c) {
    c = c || {};
    var h = '<div style="margin-top:16px;padding-top:12px;border-top:2px dashed #d9c6ff">' +
      '<h3 style="color:var(--ia);font-size:14px;margin:0 0 2px">📇 Informações do cartão</h3>' +
      '<div style="font-size:11px;color:var(--texto-suave);margin-bottom:8px">🤖 Extraído automaticamente da foto</div>';
    function campo(rotulo, valor) {
      if (!valor) return "";
      return '<div class="campo"><b>' + esc(rotulo) + '</b><span>' + esc(valor) + "</span></div>";
    }
    h += campo("Empresa", c.empresa && c.empresa.nome);
    h += campo("Nome fantasia", c.empresa && c.empresa.nome_fantasia);
    h += campo("Segmento", c.empresa && c.empresa.ramo_atividade);
    h += campo("Contato", c.pessoa && c.pessoa.nome);
    h += campo("Cargo", c.pessoa && c.pessoa.cargo);
    (c.telefones || []).forEach(function (t) {
      h += campo("Telefone (" + (t.tipo || "?") + ")", t.numero);
    });
    (c.emails || []).forEach(function (e) { h += campo("E-mail", e.valor); });
    (c.sites || []).forEach(function (s) { h += campo("Site", s.valor); });
    (c.redes_sociais || []).forEach(function (r) { h += campo("Rede (" + (r.rede || "?") + ")", r.valor); });
    if (c.endereco && c.endereco.texto) h += campo("Endereço", c.endereco.texto);
    h += campo("CNPJ", c.documentos && c.documentos.cnpj);
    (c.outras_informacoes || []).forEach(function (o) {
      h += campo("Outra informação", (o && o.texto) || o);
    });
    // item 15: texto OCR original
    var ocr = c.ocr || {};
    if (ocr.disponivel && (ocr.frente || ocr.verso)) {
      h += '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:var(--texto-suave)">[ Ver texto original ]</summary>';
      if (ocr.frente) h += '<pre style="background:#1f2430;color:#d1fae5;font-size:11px;padding:8px;border-radius:6px;white-space:pre-wrap;margin-top:6px">' + esc(ocr.frente) + "</pre>";
      if (ocr.verso) h += '<pre style="background:#1f2430;color:#d1fae5;font-size:11px;padding:8px;border-radius:6px;white-space:pre-wrap;margin-top:6px">' + esc(ocr.verso) + "</pre>";
      h += "</details>";
    }
    h += "</div>";
    return h;
  }
  function fechar() { $("modal-fundo").classList.remove("aberto"); }

  $("btn-buscar").addEventListener("click", carregar);
  $("btn-limpar").addEventListener("click", function () {
    $("busca").value = ""; $("de").value = ""; $("ate").value = ""; carregar();
  });
  $("corpo").addEventListener("click", function (e) {
    var tr = e.target.closest("tr");
    if (tr && tr.dataset.id) abrirDetalhe(tr.dataset.id);
  });
  $("modal-fundo").addEventListener("click", function (e) {
    if (e.target === $("modal-fundo")) fechar();
  });
  $("busca").addEventListener("keydown", function (e) { if (e.key === "Enter") carregar(); });

  carregar();
})();
</script>
</body>
</html>
