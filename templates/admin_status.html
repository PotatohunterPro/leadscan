<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadScan — Admin · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  :root {
    /* aliases LeadScan→HUB (cores reais vêm de /static/design-tokens.css) */
    --verde: var(--azure);
    --verde-escuro: var(--deep);
    --fundo: var(--bg);
    --cartao: var(--card);
    --borda: var(--line);
    --texto: var(--ink);
    --texto-suave: var(--mut);
    --erro: var(--danger);
    --ia: var(--azure);
    --ia-escuro: var(--deep-2);
  }
  body { font-family: var(--font-body); color: var(--texto); padding-bottom: 40px; }
  header { background: linear-gradient(90deg, var(--deep) 0%, var(--deep-2) 45%, var(--azure) 100%);
    color: #fff; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 8px 24px rgba(11,77,140,.28); position: relative; }
  header h1 { font-family: var(--font-head); font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  header nav a { color: #EAF5FD; text-decoration: none; font-size: 13px; margin-left: 14px; font-weight: 700; }
  header nav a:hover { color: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md);
    box-shadow: var(--sh-md); padding: 18px; margin-bottom: 18px; }
  .cartao h2 { font-family: var(--font-head); font-size: 16px; margin-bottom: 14px; color: var(--deep); }
  .status-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .status-item:last-child { border-bottom: none; }
  .status-item .rot { color: var(--texto-suave); min-width: 200px; font-size: 13px; }
  .ok { color: var(--green); font-weight: 800; }
  .ruim { color: var(--danger); font-weight: 800; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  button { padding: 10px 18px; border: 0; border-radius: 12px;
    background: linear-gradient(135deg, var(--azure) 0%, var(--deep) 100%); color: #fff;
    font: 800 13px var(--font-body); cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,137,206,.3), 0 1px 0 rgba(255,255,255,.25) inset; transition: .25s var(--ease); }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(0,137,206,.4), 0 1px 0 rgba(255,255,255,.25) inset; }
  button:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--azure); outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--texto-suave); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
  .vazio { color: var(--texto-suave); font-size: 13px; padding: 10px 0; }
  .link-mais { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--deep); font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="marca"><img src="/static/logo.png" alt="HUB Solução — Admin"></div>
  <nav>
    <a href="/funil">📊 Funil</a>
    <a href="/admin/leads">Leads</a>
    <a href="/admin/logout">Sair</a>
  </nav>
</header>
<main>
  <div class="cartao">
    <h2>🤖 Status da IA</h2>
    <div id="status-ia">
      <div class="status-item"><span class="rot">Consultando Ollama…</span></div>
    </div>
    <div style="margin-top:12px">
      <button id="btn-testar">Testar agora</button>
      <span id="testando" style="display:none;margin-left:10px;font-size:13px;color:var(--texto-suave)">testando…</span>
    </div>
  </div>

  <div class="cartao">
    <h2>📋 Leads coletados <span style="font-weight:400;color:var(--texto-suave);font-size:13px">(últimos 10)</span></h2>
    <table>
      <thead><tr><th>Empresa</th><th>Contato</th><th>WhatsApp</th><th>Quando</th></tr></thead>
      <tbody id="corpo-leads"><tr><td colspan="4" class="vazio">Carregando…</td></tr></tbody>
    </table>
    <a class="link-mais" href="/admin/leads">Ver todos os leads e exportar CSV →</a>
  </div>
</main>

<script>
(function () {
  var modeloConfig = {{ modelo | tojson }};
  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function carregarStatus() {
    var box = document.getElementById("status-ia");
    var botao = document.getElementById("btn-testar");
    var testando = document.getElementById("testando");
    botao.disabled = true; testando.style.display = "inline";
    fetch("/api/status")
      .then(function (r) { return r.json(); })
      .then(function (s) {
        var html = "";
        html += '<div class="status-item"><span class="rot">Ollama</span>' +
          (s.ollama_ok ? '<span class="ok">🟢 Ollama respondendo</span>' : '<span class="ruim">🔴 Ollama inacessível</span>') + "</div>";
        if (s.erro) html += '<div class="status-item"><span class="rot">Erro</span><span class="ruim">' + esc(s.erro) + "</span></div>";
        html += '<div class="status-item"><span class="rot">Modelo configurado</span><span class="mono">' + esc(s.modelo) + "</span></div>";
        html += '<div class="status-item"><span class="rot">Modelo instalado</span>' +
          (s.modelo_instalado ? '<span class="ok">🟢 Sim, aparece no Ollama</span>' : '<span class="ruim">🔴 Não encontrado — rode: ollama pull ' + esc(s.modelo) + "</span>") + "</div>";
        if (s.modelos && s.modelos.length) {
          html += '<div class="status-item"><span class="rot">Modelos no Ollama</span><span class="mono">' + esc(s.modelos.join(", ")) + "</span></div>";
        }
        html += '<div class="status-item"><span class="rot">Tesseract (OCR local)</span>' +
          (s.tesseract_ok ? '<span class="ok">🟢 Disponível</span>' : '<span class="ruim">🔴 Não instalado no container</span>') + "</div>";
        if (s.tesseract_idiomas) {
          html += '<div class="status-item"><span class="rot">Idiomas do OCR</span><span class="mono">' + esc(s.tesseract_idiomas) + "</span></div>";
        }
        html += '<div class="status-item"><span class="rot">Última extração com sucesso</span><span>' +
          (s.ultima_extracao ? esc(s.ultima_extracao) : "nenhuma ainda — tire uma foto real!") + "</span></div>";
        box.innerHTML = html;
      })
      .catch(function (e) {
        box.innerHTML = '<div class="status-item"><span class="rot">Erro</span><span class="ruim">' + esc(String(e)) + "</span></div>";
      })
      .finally(function () { botao.disabled = false; testando.style.display = "none"; });
  }
  function carregarLeads() {
    fetch("/api/leads?limite=10")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var tbody = document.getElementById("corpo-leads");
        if (!d.leads || !d.leads.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="vazio">Nenhum lead ainda.</td></tr>';
          return;
        }
        var h = "";
        d.leads.forEach(function (l) {
          h += "<tr><td>" + esc(l.nome_empresa || "—") + "</td><td>" + esc(l.nome_contato || "—") +
            "</td><td>" + esc(l.whatsapp || "—") + "</td><td>" + esc((l.criado_em || "").slice(5, 16)) + "</td></tr>";
        });
        tbody.innerHTML = h;
      })
      .catch(function (e) {
        document.getElementById("corpo-leads").innerHTML =
          '<tr><td colspan="4" class="vazio">Erro: ' + esc(String(e)) + "</td></tr>";
      });
  }
  document.getElementById("btn-testar").addEventListener("click", carregarStatus);
  carregarStatus();
  carregarLeads();
})();
</script>
</body>
</html>
